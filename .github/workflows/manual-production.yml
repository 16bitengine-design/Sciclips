name: Manual production

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Topic ID from topics/topic_queue.json"
        required: true
        default: "physics-001"
        type: string
      video_format:
        description: "Which video format to produce"
        required: true
        default: "short"
        type: choice
        options:
          - short
          - long
          - both
      animation_complexity:
        description: "Animation complexity"
        required: true
        default: "low"
        type: choice
        options:
          - low
          - medium
          - high
      narration:
        description: "Voice: espeak (default), none (subtitles only) or piper (testing only, licence unresolved)"
        required: true
        default: "espeak"
        type: choice
        options:
          - espeak
          - none
          - piper
      output_mode:
        description: "TEST = no publishing (only TEST works for now)"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - APPROVAL
          - AUTOMATIC

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools, fonts and voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Download Piper voice (only when chosen)
        if: ${{ inputs.narration == 'piper' }}
        continue-on-error: true
        run: |
          mkdir -p tools voices
          curl -fL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
          tar -xzf piper.tar.gz -C tools
          curl -fL -o voices/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx
          curl -fL -o voices/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest tests -v

      - name: Validate configuration
        run: python scripts/validate_config.py

      - name: Check topic records
        run: python content/topic_manager.py validate

      - name: Check science records for the chosen topic
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
        run: python research/science_validator.py "$TOPIC_ID"

      - name: Generate script and storyboard
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
        run: python scripts/generate_content.py

      - name: Narration, subtitles and scene clips (draft quality)
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
          RENDER_QUALITY: draft
          NARRATION_PROVIDER: ${{ inputs.narration }}
          PIPER_BIN: tools/piper/piper
          PIPER_MODEL: voices/en_US-lessac-medium.onnx
        run: python scripts/render_scenes.py

      - name: Save scripts, audio, subtitles and scene clips
        uses: actions/upload-artifact@v4
        with:
          name: scripts-audio-and-clips
          path: output/
          retention-days: 7

      - name: Run production request
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
          ANIMATION_COMPLEXITY: ${{ inputs.animation_complexity }}
          OUTPUT_MODE: ${{ inputs.output_mode }}
        run: python scripts/run_production.py
