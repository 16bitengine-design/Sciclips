name: Topic scout

# Twice daily the scout tries to add a new fully checked topic to the queue. It never publishes anything.
on:
  schedule:
    - cron: "0 2,8,14,20 * * *"   # Every 6 hours: 05:00, 11:00, 17:00 and 23:00 Uganda time
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: topic-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the science and script tests (the scout does not run if any fail)
        run: python -m pytest tests/test_stage3.py tests/test_stage4.py tests/test_chemistry.py tests/test_ai_writer.py tests/test_scout.py -q

      - name: Look for a new topic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scout_topic.py

      - name: Save the new topic (if one passed every check)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "sciclips-bot"
          git config user.email "sciclips-bot@users.noreply.github.com"
          git add topics/topic_queue.json topics/records || true
          if git diff --cached --quiet; then
            echo "No new topic tonight."
          else
            git commit -m "Topic scout: add a new topic [skip ci]"
            git push
          fi
