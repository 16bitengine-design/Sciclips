name: Voice samples

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles to hear, separated by commas. Leave empty to hear all of them."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (espeak-ng is only a pronunciation helper for Kokoro, never used as a voice)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Cache the Kokoro voice files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files-v1.1

      - name: Install the Kokoro voice
        run: |
          pip install kokoro-onnx
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Make the voice samples
        env:
          VOICE_PROFILES: ${{ inputs.profiles }}
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
        run: python scripts/voice_samples.py

      - name: Save the voice samples
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: |
            output/voice-samples/
            !output/voice-samples/work/**
          retention-days: 7
