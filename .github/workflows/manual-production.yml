name: Manual production

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Topic ID from topics/topic_queue.json"
        required: true
        default: "physics-001"
        type: string
      video_format:
        description: "Which video format to produce"
        required: true
        default: "short"
        type: choice
        options:
          - short
          - long
          - both
      animation_complexity:
        description: "Animation complexity"
        required: true
        default: "low"
        type: choice
        options:
          - low
          - medium
          - high
      narration:
        description: "Voice: kokoro (natural voice) or none (subtitles only)"
        required: true
        default: "kokoro"
        type: choice
        options:
          - kokoro
          - none
      quality:
        description: "draft = quick preview (small, never for publishing); full = final 1080p, 30 fps (much slower)"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - full
      output_mode:
        description: "TEST = no publishing (only TEST works for now)"
        required: true
        default: "TEST"
        type: choice
        options:
          - TEST
          - APPROVAL
          - AUTOMATIC

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools and fonts (espeak-ng is only a pronunciation helper for Kokoro, never used as a voice)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Cache the Kokoro voice files
        if: ${{ inputs.narration == 'kokoro' }}
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files-v1.1

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install the Kokoro voice (only when chosen)
        if: ${{ inputs.narration == 'kokoro' }}
        run: |
          pip install kokoro-onnx
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          ls -la models
          pip show kokoro-onnx | head -3

      - name: Run automated tests
        run: python -m pytest tests -v

      - name: Validate configuration
        run: python scripts/validate_config.py

      - name: Check topic records
        run: python content/topic_manager.py validate

      - name: Check science records for the chosen topic
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
        run: python research/science_validator.py "$TOPIC_ID"

      - name: Generate script and storyboard
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
        run: python scripts/generate_content.py

      - name: Produce finished videos
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
          RENDER_QUALITY: ${{ inputs.quality }}
          NARRATION_PROVIDER: ${{ inputs.narration }}
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
        run: python scripts/produce_video.py

      - name: Save finished videos, audio, subtitles and previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: finished-videos
          path: |
            output/
            !output/**/scenes/*.mp4
            !output/**/work/**
          retention-days: 7

      - name: Run production request
        env:
          TOPIC_ID: ${{ inputs.topic_id }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
          ANIMATION_COMPLEXITY: ${{ inputs.animation_complexity }}
          OUTPUT_MODE: ${{ inputs.output_mode }}
        run: python scripts/run_production.py
