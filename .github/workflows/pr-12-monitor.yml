name: Monitor Sciclips PR 12

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 09:00 Uganda time (UTC+3).
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pr-12-monitor.yml"

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: monitor-sciclips-pr-12
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR and publish an evidence-based report
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = 12;
            const workflow_id = ".github/workflows/pr-12-monitor.yml";

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number
            });

            const report = [
              "# Sciclips PR #12 — daily monitor",
              "",
              `- Checked: ${new Date().toISOString()}`,
              `- PR: [${pr.title}](${pr.html_url})`,
              `- State: **${pr.merged ? "MERGED" : pr.state.toUpperCase()}**`,
              `- Latest head: \`${pr.head.sha}\``,
              `- Mergeable: ${pr.mergeable === null ? "GitHub is still calculating" : pr.mergeable ? "Yes" : "No"}`,
              ""
            ];

            if (pr.merged || pr.state === "closed") {
              report.push(pr.merged
                ? "Monitoring complete: this pull request has been merged."
                : "Monitoring complete: this pull request was closed without merging.");
              await core.summary.addRaw(report.join("\n")).write();
              await github.rest.actions.disableWorkflow({ owner, repo, workflow_id });
              core.notice("PR #12 is terminal; the daily monitor workflow has been disabled.");
              return;
            }

            const sha = pr.head.sha;
            const [checksResponse, statusResponse] = await Promise.all([
              github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 }),
              github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })
            ]);
            const checks = checksResponse.data;
            const status = statusResponse.data;

            report.push(`- Combined commit status: **${status.state}**`);
            report.push(`- Check runs found: **${checks.total_count}**`);
            if (checks.check_runs.length) {
              report.push("", "## Latest commit checks");
              for (const check of checks.check_runs) {
                const outcome = check.status === "completed"
                  ? (check.conclusion || "completed")
                  : check.status;
                report.push(`- [${check.name}](${check.html_url}): ${outcome}`);
              }
            }
            if (status.statuses.length) {
              report.push("", "## Commit status contexts");
              for (const item of status.statuses) {
                report.push(`- [${item.context}](${item.target_url || pr.html_url}): ${item.state}`);
              }
            }
            if (!checks.total_count && !status.statuses.length) {
              report.push("", "No CI checks or commit-status contexts have been reported for the latest head yet.");
            }
            report.push("", "This monitor does not merge or modify the pull request.");
            await core.summary.addRaw(report.join("\n")).write();

            const failures = checks.check_runs
              .filter(check => check.status === "completed" &&
                ["failure", "timed_out", "action_required", "cancelled"].includes(check.conclusion))
              .map(check => `${check.name} (${check.conclusion})`);
            if (failures.length || status.state === "failure" || status.state === "error") {
              core.setFailed(`PR #12 has failing CI/status checks: ${failures.join(", ") || status.state}. See this workflow run's summary.`);
            }
