name: Automatic production

# Runs by itself every day. It can also be started by hand with "Run workflow".
# Safety rules live in config/automation.json (on/off, rehearsal mode, videos per day) and in scripts/auto_run.py.
on:
  schedule:
    - cron: "0 12 * * *"     # 12:00 UTC (15:00 in Uganda).
    - cron: "0 17 * * *"     # 17:00 UTC (20:00 in Uganda).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-production
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video tools and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Cache the Kokoro voice files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files-v1.1

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Install the Kokoro voice
        run: |
          pip install kokoro-onnx
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -fL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin

      - name: Run automated tests (nothing is published if any test fails)
        run: python -m pytest tests -q

      - name: Add new topic records to the queue
        run: python scripts/sync_queue.py

      - name: Make and publish today's video
        env:
          SCICLIPS_AI: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AI providers for the topic scout (used only when the queue is empty). Gemini first, then Groq, then Cloudflare.
          SCICLIPS_GEMINI_API_KEY: ${{ secrets.SCICLIPS_GEMINI_API_KEY }}
          SCICLIPS_GEMINI_MODEL: ${{ vars.SCICLIPS_GEMINI_MODEL }}
          SCICLIPS_GEMINI_FALLBACK_MODEL: ${{ vars.SCICLIPS_GEMINI_FALLBACK_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
          NARRATION_PROVIDER: kokoro
          SCICLIPS_RUN_KIND: ${{ github.event_name }}
          SCICLIPS_SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: python scripts/auto_run.py

      - name: Save the finished video and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: finished-videos
          path: |
            output/
            !output/**/scenes/*.mp4
            !output/**/work/**
          retention-days: 14

      - name: Remember what was done (so nothing is posted twice)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "sciclips-bot"
          git config user.email "sciclips-bot@users.noreply.github.com"
          git add -A -- records topics
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Automatic production: update records [skip ci]"
            git pull --rebase
            git push
          fi
