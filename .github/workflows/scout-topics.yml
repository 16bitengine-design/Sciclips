name: Topic scout

# Six-hour reserve check: below 8 queued topics, refill toward 14 (up to four per run). The scout never publishes.
on:
  push:
    paths:
      - ".github/workflows/scout-topics.yml"
      - "scripts/scout_topic.py"
      - "content/ai_writer.py"
      - "content/topic_scout.py"
      - "research/source_collector.py"
      - "tests/test_scout.py"
      - "config/config.json"
  schedule:
    - cron: "0 2,8,14,20 * * *"   # Every six hours: 05:00, 11:00, 17:00 and 23:00 Uganda time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the science and script tests (the scout does not run if any fail)
        run: python -m pytest tests/test_stage3.py tests/test_stage4.py tests/test_chemistry.py tests/test_ai_writer.py tests/test_scout.py -q

      - name: Look for a new topic
        env:
          SCICLIPS_GEMINI_API_KEY: ${{ secrets.SCICLIPS_FALLBACK_AI_API_KEY }}
          SCICLIPS_GEMINI_MODEL: ${{ vars.SCICLIPS_GEMINI_MODEL }}
        run: python scripts/scout_topic.py

      - name: Save the new topic (if one passed every check)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "sciclips-bot"
          git config user.email "sciclips-bot@users.noreply.github.com"
          git add topics/topic_queue.json topics/records || true
          if git diff --cached --quiet; then
            echo "No new topic tonight."
          else
            git commit -m "Topic scout: add a new topic [skip ci]"
            git push
          fi
